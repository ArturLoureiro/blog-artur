<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="css/estilos.css" />
</head>
<body>
<h1>Cadastro de Produtos</h1>
<div id="divMensagem" role="alert" aria-live="assertive"></div>
<div>
<form id="formCadProduto">
<label for="txtNome">
* Nome do Produto:
</label>
<input type="text" id="txtNome"/>
</div>
<div>
<label for="txtValor">
* Valor (R$):
</label>
<input type="number" id="txtValor" name="valor" min="0" step="0.01">
</div>

<div>
<button type="submit" id="btnCadastrar" style="margin: 10px;">CADASTRAR</button>
</div>

</form>
</div>

<script type="module" src="dist/cadProduto.js"></script>
<a href="gestaoProdutos.html" class="btn-voltar">VOLTAR</a>
</body>
</html>
